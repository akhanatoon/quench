name: 'quench — Diff-Aware Code Verification'
description: 'Run diff-aware, token-lean code verification checks with quench'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  version:
    description: 'quench release version to install (e.g. v0.1.2 or latest)'
    required: false
    default: 'latest'
  base:
    description: 'Git base ref or commit SHA to diff against'
    required: false
    default: "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
  format:
    description: 'Output format: github, text, json, or sarif'
    required: false
    default: 'github'
  only:
    description: 'Comma-separated list of check names to run (optional)'
    required: false
    default: ''
  fail-fast:
    description: 'Cancel remaining checks on first failure'
    required: false
    default: 'true'
  changed-lines-only:
    description: 'Suppress non-test diagnostics on lines untouched by git diff'
    required: false
    default: 'false'
  working-directory:
    description: 'Target git repository directory'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install quench
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        os_raw="$(uname -s)"
        arch_raw="$(uname -m)"

        case "${os_raw}" in
          Linux)  os="linux" ;;
          Darwin) os="darwin" ;;
          *)
            echo "::error::Unsupported OS: ${os_raw}"
            exit 1
            ;;
        esac

        case "${arch_raw}" in
          x86_64|amd64)  arch="amd64" ;;
          arm64|aarch64) arch="arm64" ;;
          *)
            echo "::error::Unsupported architecture: ${arch_raw}"
            exit 1
            ;;
        esac

        target="${os}_${arch}"
        case "${target}" in
          linux_amd64|linux_arm64|darwin_arm64|darwin_amd64) ;;
          *)
            echo "::error::Unsupported platform target: ${target}"
            exit 1
            ;;
        esac

        version="${INPUT_VERSION:-latest}"
        if [ "${version}" = "latest" ]; then
          effective_url="$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/akhanatoon/quench/releases/latest")"
          tag="${effective_url##*/tag/}"
          if [ -z "${tag}" ] || [ "${tag}" = "${effective_url}" ]; then
            echo "::error::Failed to resolve latest quench release tag from ${effective_url}"
            exit 1
          fi
        else
          tag="v${version#v}"
        fi

        ver="${tag#v}"
        asset="quench_${ver}_${os}_${arch}.tar.gz"
        base_url="https://github.com/akhanatoon/quench/releases/download/${tag}"

        tmp_dir="$(mktemp -d "${RUNNER_TEMP}/quench-dl.XXXXXX")"
        trap 'rm -rf "${tmp_dir}"' EXIT

        echo "Downloading ${asset} (${tag})..."
        curl -fsSL "${base_url}/${asset}" -o "${tmp_dir}/${asset}"
        curl -fsSL "${base_url}/checksums.txt" -o "${tmp_dir}/checksums.txt"

        expected="$(awk -v f="${asset}" '$2 == f || $2 == "*"f { print $1 }' "${tmp_dir}/checksums.txt")"
        if [ -z "${expected}" ]; then
          echo "::error::Checksum entry for ${asset} not found in checksums.txt"
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${tmp_dir}/${asset}" | awk '{ print $1 }')"
        else
          actual="$(shasum -a 256 "${tmp_dir}/${asset}" | awk '{ print $1 }')"
        fi

        if [ "${expected}" != "${actual}" ]; then
          echo "::error::SHA256 mismatch for ${asset}: expected ${expected}, got ${actual}"
          exit 1
        fi

        bin_dir="${RUNNER_TEMP}/quench-bin"
        mkdir -p "${bin_dir}"
        tar -xzf "${tmp_dir}/${asset}" -C "${bin_dir}" quench
        chmod +x "${bin_dir}/quench"
        echo "${bin_dir}" >> "${GITHUB_PATH}"

    - name: Run quench
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_ONLY: ${{ inputs.only }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_CHANGED_LINES_ONLY: ${{ inputs.changed-lines-only }}
      run: |
        set -euo pipefail

        args=(
          -C "${INPUT_WORKING_DIRECTORY}"
          run
          --local
          --base "${INPUT_BASE}"
          --format "${INPUT_FORMAT}"
        )

        if [ -n "${INPUT_ONLY}" ]; then
          args+=(--only "${INPUT_ONLY}")
        fi
        if [ "${INPUT_FAIL_FAST}" = "true" ]; then
          args+=(--fail-fast)
        fi
        if [ "${INPUT_CHANGED_LINES_ONLY}" = "true" ]; then
          args+=(--changed-lines-only)
        fi

        quench "${args[@]}"
