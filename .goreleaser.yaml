version: 2

project_name: quench

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: quench
    main: ./cmd/quench
    binary: quench
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/akhanatoon/quench/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
