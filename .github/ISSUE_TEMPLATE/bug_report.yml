name: Bug Report
description: Report a bug or unexpected behavior in quench
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command run, relevant quench.yaml snippet, and minimal repro steps.
      placeholder: |
        quench run --base origin/main --json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: quench version
      placeholder: "quench version 0.1.3"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Go version, Docker mode (local / Docker Desktop / remote DOCKER_HOST), and stack.
      placeholder: "Linux / macOS / Windows, Docker 27.x, Go + Next.js monorepo"
  - type: textarea
    id: doctor
    attributes:
      label: quench doctor output (optional)
      render: text
